<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fotos del palet</title>
<style>
  :root {
    --azul: #1F3864; --suave: #6E7A8F; --texto: #232935; --borde: #DBE2EE;
    --fondo: #F4F6FA; --blanco: #fff; --ok: #1E6B34; --okf: #E2F0D9; --mal: #9C2A1E; --malf: #FBE3DF;
    --T4: #D9952B; --T5: #C65A3A; --T6: #A42A32;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--texto); background: var(--fondo); }
  header { background: var(--azul); color: var(--blanco); padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  .tramo { padding: 3px 12px; border-radius: 4px; font-weight: 700; color: #fff; }
  .itrn { opacity: .85; font-size: 14px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px 20px; max-width: 1400px; margin: auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--blanco); border: 1px solid var(--borde); border-radius: 8px; padding: 14px; }
  video { width: 100%; max-height: 72vh; background: #111; border-radius: 6px; display: block; }
  .barra { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  select { font: inherit; padding: 6px 8px; border: 1px solid var(--borde); border-radius: 6px; min-width: 240px; }
  button { font: inherit; border: 0; border-radius: 6px; padding: 9px 16px; cursor: pointer; background: var(--borde); color: var(--texto); }
  button.principal { background: var(--azul); color: #fff; font-weight: 700; font-size: 17px; padding: 12px 26px; }
  button:disabled { opacity: .45; cursor: default; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--suave); margin: 0 0 8px; }
  .aviso { border-radius: 6px; padding: 10px 12px; margin: 0 0 12px; display: none; }
  .aviso.mal { display: block; background: var(--malf); color: var(--mal); }
  .aviso.ok { display: block; background: var(--okf); color: var(--ok); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 6px 0; border-bottom: 1px solid var(--borde); font-variant-numeric: tabular-nums; word-break: break-all; }
  .mini { max-width: 100%; border-radius: 4px; margin-top: 10px; display: none; }
  .gris { color: var(--suave); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="lp">LP</h1>
  <span class="tramo" id="tramo"></span>
  <span class="itrn" id="itrn"></span>
</header>
<main>
  <section class="panel">
    <div id="aviso" class="aviso"></div>
    <video id="video" autoplay playsinline muted></video>
    <div class="barra">
      <button id="foto" class="principal" disabled>📷 Hacer foto</button>
      <select id="camaras" aria-label="Cámara"></select>
    </div>
  </section>
  <aside class="panel">
    <h2>Fotos de este LP en este PC</h2>
    <ul id="lista"><li class="gris">Ninguna todavía</li></ul>
    <img id="ultima" class="mini" alt="Última foto">
    <p class="gris" style="margin-top:14px">Las fotos se guardan en <b>Descargas</b>. Súbelas después a la
      carpeta del ITRN en OneDrive.</p>
  </aside>
</main>
<script>
"use strict";
// Fotos de palets degradados: se abre desde el 📷 del informe General Transfer view.
// Parametros: c = carpeta del ITRN, lp = License plate, t = tramo (T4/Industry/Dump).
// Cada foto se descarga como ITRN-LP-n.jpg en Descargas; se suben a mano a OneDrive.

const q = new URLSearchParams(location.search);
const CARPETA = (q.get("c") || "").trim();
// codigo del ITRN para el nombre: "ITRN-000100576 PT BOA" -> "ITRN-000100576"
const ITRN = CARPETA.split(/\s+/)[0].replace(/[^\w.-]/g, "");
const LP = (q.get("lp") || "").trim().replace(/[^\w.-]/g, "");
const TRAMOS = { T4: ["T4 / TRADE", "var(--T4)"], INDUSTRY: ["T5 / INDUSTRY", "var(--T5)"],
                 T5: ["T5 / INDUSTRY", "var(--T5)"], DUMP: ["T6 / DUMP", "var(--T6)"], T6: ["T6 / DUMP", "var(--T6)"] };
const TRAMO = TRAMOS[(q.get("t") || "").trim().toUpperCase()] || null;

const $ = (id) => document.getElementById(id);
const video = $("video"), selCam = $("camaras"), btnFoto = $("foto");
let flujo = null, guardando = false;

function avisar(texto, tipo) {
  const a = $("aviso");
  a.textContent = texto || "";
  a.className = "aviso" + (texto ? " " + tipo : "");
  document.title = (tipo === "mal" ? "ERROR: " : "") + (texto || "Fotos del palet");
}

// ---------- cabecera ----------
$("lp").textContent = LP ? "LP " + LP : "Falta el LP";
$("itrn").textContent = CARPETA || "Falta el ITRN";
if (TRAMO) { $("tramo").textContent = TRAMO[0]; $("tramo").style.background = TRAMO[1]; }
else $("tramo").style.display = "none";

// ---------- numeracion: la lleva este PC para cada ITRN y LP ----------
const nombreFoto = (n) => (ITRN ? ITRN + "-" : "") + LP + "-" + n + ".jpg";
const claveContador = () => "n|" + ITRN + "|" + LP;
const hechas = () => +(localStorage.getItem(claveContador()) || 0);

function listar() {
  const n = hechas();
  $("lista").innerHTML = n ? "" : '<li class="gris">Ninguna todavía</li>';
  for (let i = 1; i <= n; i++) { const li = document.createElement("li"); li.textContent = nombreFoto(i); $("lista").appendChild(li); }
}

// ---------- camaras ----------
// Algunas camaras (sobre todo 4K por USB 3) no arrancan a la resolucion maxima o no
// dan imagen: se prueba de mayor a menor y se acepta la primera que pinte un fotograma.
const RESOLUCIONES = [[4096, 2160], [1920, 1080], [1280, 720], null];

function hayImagen(ms) {
  return new Promise((ok) => {
    if (video.videoWidth > 0) return ok(true);
    const t = setTimeout(() => ok(video.videoWidth > 0), ms);
    video.addEventListener("loadeddata", () => { clearTimeout(t); ok(video.videoWidth > 0); }, { once: true });
  });
}

async function abrirCamara(id) {
  btnFoto.disabled = true;
  let ultimoError = null;
  for (const r of RESOLUCIONES) {
    if (flujo) { flujo.getTracks().forEach((t) => t.stop()); flujo = null; }
    const v = r ? { width: { ideal: r[0] }, height: { ideal: r[1] } } : {};
    if (id) v.deviceId = { exact: id };
    try {
      flujo = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
    } catch (e) {
      ultimoError = e;
      if (e.name === "NotAllowedError" || e.name === "NotFoundError") throw e;
      continue;                                   // NotReadable / Overconstrained: probar menos
    }
    video.srcObject = flujo;
    video.play().catch(() => {});
    if (await hayImagen(4000)) {
      const ajustes = flujo.getVideoTracks()[0].getSettings();
      if (ajustes.deviceId) localStorage.setItem("camara", ajustes.deviceId);
      btnFoto.disabled = !LP || !CARPETA;
      return ajustes;
    }
    ultimoError = new Error("la cámara no da imagen");
  }
  if (flujo) { flujo.getTracks().forEach((t) => t.stop()); flujo = null; }
  throw ultimoError || new Error("la cámara no responde");
}

async function listarCamaras(elegida) {
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  selCam.innerHTML = "";
  cams.forEach((c, i) => {
    const o = document.createElement("option");
    o.value = c.deviceId;
    o.textContent = c.label || "Cámara " + (i + 1);
    selCam.appendChild(o);
  });
  if (elegida) selCam.value = elegida;
  return cams;
}

selCam.onchange = async () => {
  try { await abrirCamara(selCam.value); avisar("", ""); }
  catch (e) { avisar("No se pudo abrir esa cámara (" + (selCam.selectedOptions[0] || {}).textContent + "): " + e.message + ". Prueba con otra o desconéctala y vuelve a conectarla.", "mal"); }
};

// ---------- hacer la foto ----------
function capturar() {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return Promise.reject(new Error("la cámara aún no da imagen"));
  const lienzo = document.createElement("canvas");
  lienzo.width = w; lienzo.height = h;
  lienzo.getContext("2d").drawImage(video, 0, 0, w, h);
  return new Promise((ok, mal) => lienzo.toBlob((b) => (b ? ok(b) : mal(new Error("no se pudo crear el JPG"))), "image/jpeg", 0.92));
}

function descargar(blob, nombre) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

btnFoto.onclick = async () => {
  if (guardando) return;
  guardando = true; btnFoto.disabled = true;
  try {
    const blob = await capturar();
    $("ultima").src = URL.createObjectURL(blob); $("ultima").style.display = "block";
    const n = hechas() + 1;
    localStorage.setItem(claveContador(), n);
    const nombre = nombreFoto(n);
    descargar(blob, nombre);
    avisar("Descargada " + nombre + ". Súbela a la carpeta «" + CARPETA + "» en OneDrive.", "ok");
    window.ultimaFoto = { nombre, bytes: blob.size };
    listar();
  } catch (e) {
    avisar("No se pudo hacer la foto: " + e.message, "mal");
  } finally {
    guardando = false; btnFoto.disabled = !flujo;
  }
};

// ---------- arranque ----------
(async () => {
  if (!LP || !CARPETA) avisar("Abre esta página desde el 📷 de una línea del informe: falta el LP o el ITRN.", "mal");
  listar();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    avisar("Este navegador no da acceso a la cámara. Ábrelo en Edge o Chrome.", "mal"); return;
  }
  try {
    const recordada = localStorage.getItem("camara");
    let ajustes;
    try { ajustes = await abrirCamara(recordada); }
    catch (e) { if (recordada && (e.name === "OverconstrainedError" || e.name === "NotFoundError")) ajustes = await abrirCamara(null); else throw e; }
    const cams = await listarCamaras(ajustes.deviceId);
    if (!LP || !CARPETA) btnFoto.disabled = true;
    else if (!$("aviso").textContent) avisar("", "");
    document.title = "LISTO " + cams.length + " camara(s) " + (ajustes.width || 0) + "x" + (ajustes.height || 0);
    // ?prueba=1: hace dos fotos solas (pruebas automaticas sin pantalla)
    if (q.get("prueba") === "1") {
      localStorage.removeItem(claveContador());
      await new Promise((r) => setTimeout(r, 800));
      await btnFoto.onclick(); await btnFoto.onclick();
      document.title = "PRUEBA " + document.title.replace(/^ERROR: /, "") + " | ultima " + JSON.stringify(window.ultimaFoto) +
                       " | lista " + [...$("lista").children].map((li) => li.textContent).join(",");
    }
  } catch (e) {
    if (e.name === "NotAllowedError") avisar("No hay permiso para usar la cámara. Pulsa el icono de la cámara en la barra de direcciones y permítelo.", "mal");
    else if (e.name === "NotFoundError") avisar("Este PC no tiene ninguna cámara conectada.", "mal");
    else avisar("No se pudo abrir la cámara: " + e.message, "mal");
  }
})();
</script>
</body>
</html>
